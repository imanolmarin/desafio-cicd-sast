# Pipeline base del desafio SAST (Python).
# En GitHub corre el equivalente en .github/workflows/ci.yml.

stages:
  - build
  - test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # CONSIGNA.md trae la clave de ejemplo de AWS del enunciado (falso positivo).
  SECRET_DETECTION_EXCLUDED_PATHS: "CONSIGNA.md"

default:
  image: python:3.12-slim

install:
  stage: build
  script:
    - python -m venv .venv
    - .venv/bin/pip install -r requirements.txt
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .venv/
  artifacts:
    paths:
      - .venv/
    expire_in: 1 hour

unit-tests:
  stage: test
  needs: [install]
  script:
    - .venv/bin/pytest -q
